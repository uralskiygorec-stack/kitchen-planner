 const sorted=[...list].sort((a,b)=>b.y-a.y||a.x-b.x),tagGap=22;for(const [i,q]of sorted.entries()){const [px,py]=point(q),ty=42+i*tagGap,sel=q.id===selectedId;out+=`<g data-hole="${q.id}" data-face="${f}" style="cursor:pointer"><path d="M${px} ${py}H${Math.max(x+rw+8,px+8)}L332 ${ty}" fill="none" stroke="${sel?'#d49742':'#b0bcc5'}" stroke-width="${sel?1.5:.8}"/><circle cx="${px}" cy="${py}" r="${Math.max(q.diameter/2*scale,3)}" fill="${sel?'#d7943d':q.kind==='support'?'#589583':'#4f82b1'}"/><text x="338" y="${ty+4}" font-size="14" fill="${sel?'#a3691b':'#496276'}">${esc(q.id.split('-').slice(1).join('-'))}</text></g>`;}
 const q=list.find(q=>q.id===selectedId);if(q){const [px,py]=point(q);out+=`<path d="M${px} ${py}V${y+rh+44} M${x} ${y+rh+38}v12 M${x} ${y+rh+44}H${px} M${px} ${y+rh+38}v12 M${px} ${py}H${x+rw+18} M${x+rw+12} ${py}h12 M${x+rw+18} ${py}V${y+rh} M${x+rw+12} ${y+rh}h12" stroke="#bd8638" fill="none" stroke-width="1"/><text x="${(x+px)/2}" y="${y+rh+60}" font-size="15" fill="#9c6826" text-anchor="middle">X ${fmt(q.x)}</text><text x="${x+rw+23}" y="${(py+y+rh)/2}" font-size="15" fill="#9c6826">Y ${fmt(q.y)}</text>`;}else if(!list.length)out+=`<text x="${x+rw/2}" y="${y+rh/2+4}" text-anchor="middle" fill="#8c99a4" font-size="15">Нет отверстий</text>`;return out+'</svg>';}
function sketch(parts,highlight,stage=null){const bounds=parts.map(p=>{const sz=[0,0,0];p.axes.forEach((a,i)=>a.forEach((v,j)=>sz[j]+=Math.abs(v)*[p.u,p.v,p.t][i]));return {...p,size:sz};});if(!bounds.length)return '';const proj=v=>[v[0]+v[2]*.45,-v[1]-v[2]*.22];let polys=[];for(const p of bounds){const [x,y,z]=p.origin,[w,h,d]=p.size;const pts=[[x,y,z],[x+w,y,z],[x+w,y+h,z],[x,y+h,z],[x,y,z+d],[x+w,y,z+d],[x+w,y+h,z+d],[x,y+h,z+d]];for(const face of [[0,1,2,3],[4,5,6,7],[3,2,6,7],[1,5,6,2]])polys.push({id:p.id,pts:face.map(i=>proj(pts[i])),z:x+z});}polys.sort((a,b)=>a.z-b.z);const all=polys.flatMap(p=>p.pts),min=[Math.min(...all.map(v=>v[0])),Math.min(...all.map(v=>v[1]))],max=[Math.max(...all.map(v=>v[0])),Math.max(...all.map(v=>v[1]))];return `<svg viewBox="${min[0]-80} ${min[1]-80} ${max[0]-min[0]+160} ${max[1]-min[1]+160}" role="img" aria-label="Реальный эскиз модуля"><g>${polys.map(p=>`<polygon points="${p.pts.map(v=>v.join(',')).join(' ')}" fill="${p.id===highlight?'#e4ae64':stage?.includes(p.id)?'#86a8ba':'#e7ecef'}" stroke="#758c9b" stroke-width="3"/>`).join('')}</g></svg>`;}
function renderDrilling(){const p=getPart();if(!p){$('#view-drilling').innerHTML='<div class="empty">У выбранного модуля пока нет карт деталей: проём техники требует её паспорта</div>';return;}const holes=p.holes,q=holes.find(h=>h.id===selectedHole),m=model.modules.find(m=>m.id===p.module);$('#view-drilling').innerHTML=`<div class="section-head"><div><h1>${p.id} · ${esc(p.name)}</h1><p class="subheading">Все ${holes.length} отверстий детали, по шести сторонам. Цвет отверстия связан с его строкой. Координаты от точки O, в миллиметрах.</p></div><div class="actions"><button data-action="part-3d">Деталь в 3D</button><button data-action="context-3d">В шкафу</button><button data-action="print">Печать карты</button></div></div><select id="drill-part" class="drill-selector" aria-label="Деталь">${model.parts.map(p=>`<option value="${p.id}" ${p.id===selected?'selected':''}>${p.id} · ${esc(p.name)}</option>`).join('')}</select><div class="drill-layout"><div><div class="orientation">${sketch(model.parts.filter(p=>p.module===m.id),p.id)}<span><b>${m.id}</b> · положение детали в модуле<br>Цветом выделена ${p.id}.<br>U — первая длина детали, V — вторая.<br>A/B — пласти; U0/U1, V0/V1 — торцы.</span></div><div class="face-grid">${faces.map(f=>`<div class="face-card ${q?.face===f?'active':''}"><header><b>${f} · ${['A','B'].includes(f)?'пласть':'торец'}</b><span>${p.holes.filter(q=>q.face===f).length} отверстий</span></header>${faceSVG(p,f,selectedHole)}</div>`).join('')}</div><p class="hint">Все схемы в локальных координатах U/V без зеркального переворота. O — пересечение нулевых рёбер. Перед сверлением отметь базовые рёбра на детали.</p></div><div><div class="surface"><h3>Размер детали</h3><div class="dim-grid"><div><b>${fmt(p.u)}</b>U, мм</div><div><b>${fmt(p.v)}</b>V, мм</div><div><b>${fmt(p.t)}</b>толщина</div></div><p class="hint">После кромления</p></div>${q?`<div class="hole-detail"><b>${q.id} · ${holeLabel(q)}</b><dl><dt>Сторона</dt><dd>${q.face}</dd><dt>От базы X</dt><dd>${fmt(q.x)} мм</dd><dt>От базы Y</dt><dd>${fmt(q.y)} мм</dd><dt>Диаметр · проект</dt><dd>Ø${q.diameter}</dd><dt>Глубина</dt><dd>${q.depth===null?'не подтверждена':fmt(q.depth)+' мм · насквозь'}</dd><dt>Соединяется с</dt><dd>${q.pair}</dd></dl><p class="hint">${q.kind==='pilot'?'Торцевая ось посередине толщины. Глубину и зенковку согласовать с крепежом.':q.kind==='support'?'Высота отверстия учитывает проектный подъём опоры 2,5 мм. Уточнить выбранный полкодержатель.':'Диаметр прохода и зенковку подтвердить пробой и паспортом крепежа.'}</p><button data-action="pair">Посмотреть вторую деталь →</button></div>`:''}<div class="surface hole-table"><h3>Отверстия · ${holes.length}</h3>${holes.map(h=>`<button class="hole-row ${h.id===selectedHole?'active':''}" data-hole="${h.id}"><b>${h.id.replace(p.module+'-','')}</b><span>${h.face} · X ${fmt(h.x)} / Y ${fmt(h.y)}<small class="muted">${holeLabel(h)} → ${h.pair}</small></span></button>`).join('')||'<p class="hint">Фурнитура этой детали ещё не назначена. Отсутствие отверстий не означает готовность к производству.</p>'}</div><span class="badge">Карта для согласования с мастерской</span></div></div>`;}
function renderAssembly(){const m=model.modules.find(m=>m.id===active);if(!m){$('#view-assembly').innerHTML='';return;}if(m.type==='appliance'||m.type==='furniture'){$('#view-assembly').innerHTML='<div class="surface"><h1>Установка техники</h1><p>Это объём для планирования. Детали, вентиляция, зазоры и крепёж назначаются по паспорту выбранного прибора.</p></div>';return;}const ps=model.parts.filter(p=>p.module===active),bottom=ps.find(p=>p.name==='Дно'),side=ps.filter(p=>p.name.includes('стойка')),tops=ps.filter(p=>p.name.includes('стяжка')||p.name==='Крыша'),shelves=ps.filter(p=>p.name.includes('полка')),back=ps.find(p=>p.kind==='back'),front=ps.filter(p=>p.kind==='front');const steps=[['Подготовить и разметить',ps.map(p=>p.id),`Сверь номера и кромку. Стойки ${side.map(p=>p.id).join(', ')}: ${fmt(m.d)} × ${fmt(m.bodyH)} × ${m.t} мм. Поставь метки O и сторон A/B. Согласуй профиль сверла на обрезке той же плиты.`],['Собрать корпус на мягком основании',[...side,...(bottom?[bottom]:[]),...tops].map(p=>p.id),`Положи стойку наружной стороной вниз. Дно ${bottom?.id} находится у нижних торцов стоек, ось конфирматов на ${m.t/2} мм от торца. Поставь дно и ${tops.map(p=>p.id).join(', ')}; затем вторую стойку. Сначала наживи все соединения, проверь прямые углы. Для задней стенки оставь доступ.`],['Выставить геометрию и закрепить задник',back?[back.id]:[],`Замерь обе диагонали корпуса: они должны совпадать в пределах согласованного допуска. ${back?'Задник '+back.id+' — '+fmt(back.u)+' × '+fmt(back.v)+' мм. Крепёж и шаг пока не назначены.':'Под мойкой задника нет: жёсткость и крепление стяжек проверить до установки.'} Окончательно стягивай корпус после выравнивания.`],['Установить полки',shelves.map(p=>p.id),shelves.length?shelves.map(p=>`${p.id}: нижняя поверхность на ${fmt(p.origin[1]-(m.type==='wall'?(m.mountY??1450):0)-m.leg)} мм выше низа стойки; ${m.fixed?'жёсткое крепление':'съёмная, проектный зазор 1 мм сбоку'}.`).join(' '):'В этом варианте полок нет.'],['Поставить модуль и смонтировать фурнитуру',[],`${m.type==='wall'?'Не поднимать и не подвешивать до выбора подвеса, проверки стены и нагрузки.':'Перед установкой согласуй опоры, их количество и крепление.'} Направляющие, петли и их высоты монтируй только по выбранному артикулу. Соседние корпуса соединяй после выставления уровня.`],['Навесить фасады и проверить движение',front.map(p=>p.id),`Зазор фасадов ${fmt(m.gap)} мм одинаковый сверху, снизу и между соседними фасадами внутри модуля. Регулировки выполняются на фурнитуре. Проверь свободный ход с ручками и соседними модулями. Анимация открывания в модели иллюстрирует направление, но не является полной проверкой столкновений.`]];
 $('#view-assembly').innerHTML=`<div class="section-head"><div><h1>Сборка ${active}</h1><p class="subheading">Эскизы построены из тех же деталей, что и 3D. Размеры в шагах относятся к текущему модулю.</p></div><button data-action="print">Печать</button></div><div class="steps">${steps.map(([title,ids,text],i)=>`<article class="surface assembly-step">${sketch(ps,null,ids)}<div><div class="step-no">ШАГ ${i+1} / ${steps.length}</div><h3>${title}</h3><p>${text}</p><div class="actions" style="margin-top:12px">${ids.slice(0,6).map(id=>`<button data-part="${id}" data-action="drill">${id} · отверстия</button>`).join('')}</div></div></article>`).join('')}</div>`;}
function renderOrder(){const ms=model.modules,blocking=model.issues.filter(i=>i.blocking),groups=Kitchen.groups(model),edgeLen=model.parts.reduce((s,p)=>s+(p.edges.U0+p.edges.U1?0:0)+(['U0','U1'].reduce((n,k)=>n+(p.edges[k]?p.v:0),0)+['V0','V1'].reduce((n,k)=>n+(p.edges[k]?p.u:0),0))/1000,0);$('#view-order').innerHTML=`<div class="section-head"><div><h1>Черновой комплект · ревизия ${config.revision}</h1><p class="subheading">Разделим заказ на распил, кромление, присадку и фурнитуру. Цены пока не ищем и не заполняем.</p></div><span class="badge bad">${blocking.length} уточнений до производства</span></div>${constructionSummary()}<div class="surface"><div class="dim-grid"><div><b>${model.parts.length} / ${groups.length}</b>деталей / разных карт</div><div><b>${model.confirmats}</b>конфирматов корпуса</div><div><b>${fmt(edgeLen)} м</b>кромка без запаса</div></div><p class="hint">Количество конфирматов — только рассчитанные соединения корпуса. Крепёж фасадов, направляющих, опор, подвесов, задника и соединения модулей не включён.</p></div><div class="split"><div class="surface"><h3>Файлы проекта</h3><p>Размеры плит и кромка пересчитываются. Присадка содержит рассчитанные координаты и неподтверждённые параметры; это пакет для согласования, не готовая программа станка.</p><div class="actions" style="margin-top:12px"><button data-action="cut-csv" class="primary">Детали и кромка · CSV</button><button data-action="holes-csv">Отверстия · черновик CSV</button><button data-action="save-json">Проект · JSON</button><button data-action="dxf">Текущая деталь · DXF</button></div><p class="hint">DXF экспортирует одну выбранную сторону ${getPart()?.holes.find(h=>h.id===selectedHole)?.face||'A'} детали ${selected||'—'}, слой DRAFT. Открой карту и выбери отверстие нужной стороны.</p></div><div class="surface"><h3>Где экономить без ухудшения материала</h3><p>Повторять размеры модулей и заготовок, объединять заказ на распил и кромление, использовать обычные фасады и ручки, собирать корпуса самостоятельно после пробной присадки.</p><p>Угловые механизмы, подъёмники и нестандартные ящики добавляют деталей и операций. Их стоит выбирать под реальную задачу. Не экономить на подвесе, опорах, влагозащите и направляющих под расчётную нагрузку.</p></div></div><div class="surface"><h3>Проверки геометрии</h3>${model.errors.length?model.errors.map(e=>`<p class="danger">${esc(e)}</p>`).join(''):`<span class="badge good">Границы деталей и отверстий: без ошибок</span><p class="hint">Проверены размеры, кромка и попадание рассчитанных отверстий в деталь. Несущая способность, столкновения фурнитуры, допуски цеха и соответствие всей кухни требованиям не подтверждены этой проверкой.</p>`}</div><div class="surface"><h3>Уточнить перед распилом и сверлением</h3><div class="issue-list">${model.issues.map(i=>`<div class="issue"><b>${i.module}</b><div>${esc(i.message)}<small>${i.blocking?'Требуется до заказа':'Рекомендация'}</small></div></div>`).join('')}</div></div><div class="help" id="hardware-advice"><h2>Как выбрать фурнитуру</h2><details open><summary>Hettich как основа · когда нужен более сложный комплект</summary><p>Sensys 8645i 9071205 — обычная накладная петля 110°. Sensys 8657i 9099540 — широкоугольная 165° с нулевым выступанием для соответствующих задач. Совместимая планка 9071575: D0, линия 37 мм, расстояние между центрами 32 мм. Количество петель зависит от фасада.</p><p>Quadro YOU: серии с классами 10/30 кг. Actro YOU: 10/40/70 кг. Actro 5D: регулировки деревянного ящика в пяти направлениях. Подбирай точный артикул по весу ящика с содержимым, длине и нужным регулировкам. Нагрузка не универсальна для любого комплекта.</p></details><details><summary>Когда рассмотреть Blum</summary><p>Blum можно выбрать отдельно для сложного модуля: подъёмный фасад, тяжёлый ящик или особый способ открывания. Сравнивай комплект с комплектом: нагрузку, регулировки, плавность хода, монтаж, наличие запасных частей и цену у поставщика. Пока нет цен и точных артикулов, объявить один бренд лучшим по цене/качеству нельзя.</p></details><details><summary>Почему нельзя считать всю присадку «по ГОСТу»</summary><p>ТР ТС 025/2012 задаёт требования безопасности мебельной продукции. Профили присадки устанавливает производитель конкретной фурнитуры. Толщина плиты, зазоры и монтажные отступы в этой модели — параметры проекта. Конструктор не заменяет проверку устойчивости, нагрузок, крепления к стене и документацию техники.</p></details><details><summary>Что передать мастерской</summary><p>JSON проекта, список деталей с чистовыми размерами и размерами заготовок, стороны и толщину кромки, материал и направление текстуры. Затем — подтверждённые артикулы крепежа, пробу сверления и карты со стороной детали, базой O, X/Y, диаметрами и глубинами. Согласуй допуски, базирование до/после кромления и допустимые минимальные размеры заготовки. Присадку с пометкой «уточнить» не запускать на станке.</p></details></div><div class="surface" style="margin-top:20px"><h3>Документы производителей и требования</h3><div class="source-list"><a target="_blank" rel="noopener" href="${research.hettichBaseHinge.source}">Sensys 8645i ↗</a><a target="_blank" rel="noopener" href="${research.hettichCompatiblePlate.source}">Планка 9071575 ↗</a><a target="_blank" rel="noopener" href="${research.drawerComparison.source}">Системы ящиков Hettich ↗</a><a target="_blank" rel="noopener" href="https://www.blum.com/gb/en/services/planning-construction-product-selection/cabinet-configurator/">Blum Cabinet Configurator ↗</a><a target="_blank" rel="noopener" href="${research.regulatorySources[0].url}">ТР ТС 025/2012 ↗</a></div></div>`;}
function updateTechnicalCard(){const p=getPart(),card=$('#part-card');card.hidden=!p;if(!p)return;card.innerHTML=`<small>Деталь ${p.id} · ${p.module}</small><h3>${esc(p.name)}</h3><div class="measure">${fmt(p.u)} × ${fmt(p.v)} × ${p.t} мм</div><p class="hint">${p.material} · ${p.holes.length} отверстий</p><button data-action="drill" data-part="${p.id}">Размеры и отверстия →</button><button data-action="clear-part">Убрать выделение</button>`;}
function download(name,text,type='text/plain;charset=utf-8'){const url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);}

let kitchenTab='catalog',redoStack=[],revisionBaseline=null,revisionSerial=0,insideModule=false,rowChainKey='';

function validateWorkflowData(c){
 c.schemaVersion=2;c.revision=Number.isInteger(c.revision)&&c.revision>=0?c.revision:0;
 c.room.measurement=c.room.measurement==='confirmed'?'confirmed':'approximate';c.room.note=String(c.room.note||'').slice(0,2000);
 c.room.obstacles=Array.isArray(c.room.obstacles)?c.room.obstacles.slice(0,30):[];
 const obstacleIDs=new Set();for(const o of c.room.obstacles){if(!/^T\d+$/.test(o.id)||obstacleIDs.has(o.id)||!KitchenRows.walls.includes(o.wall)||!['offset','depth','diameter','bottom','height'].every(k=>Number.isFinite(o[k])))throw Error('Неверные данные трубы');obstacleIDs.add(o.id);o.locked=true;}
 c.rows=Array.isArray(c.rows)?c.rows.slice(0,30):[];const members=new Set(),rowIds=new Set();for(const r of c.rows){if(!/^R[\d]+[b]*$/.test(r.id)||rowIds.has(r.id)||!KitchenRows.walls.includes(r.wall)||!Array.isArray(r.members)||!['start','gap','frontLine'].every(k=>Number.isFinite(r[k]))||r.start<0||r.gap<0||r.gap>20||r.frontLine<=0)throw Error('Неверные данные ряда');rowIds.add(r.id);for(const id of r.members){if(members.has(id)||!c.modules.some(m=>m.id===id))throw Error('Повторный или неизвестный модуль в ряду');members.add(id);}}

function fingerprint(c){const {revision,...data}=c;const order=v=>Array.isArray(v)?v.map(order):v&&typeof v==='object'?Object.fromEntries(Object.keys(v).sort().map(k=>[k,order(v[k])])):v;return JSON.stringify(order(data));}
function commitRevision(){const key=fingerprint(config);revisionSerial=Math.max(revisionSerial,config.revision||0);if(revisionBaseline!==null&&key!==revisionBaseline)config.revision=++revisionSerial;else config.revision=revisionSerial;revisionBaseline=key;}

 const dialog=document.createElement('dialog');dialog.id='new-project-dialog';dialog.innerHTML=`<form method="dialog"><small>Чистовые внутренние размеры</small><h2>Новое помещение</h2><p>Прямоугольная комната. Текущий проект сохранится в резервной копии и останется доступен через отмену.</p>${[['w','Ширина',3600,1800,12000],['d','Глубина',3200,1800,12000],['h','Потолок',2400,2000,4000]].map(([k,l,v,min,max])=>`<label>${l} · мм<input data-new-room="${k}" type="number" min="${min}" max="${max}" value="${v}" required></label>`).join('')}<div class="actions"><button value="cancel">Отмена</button><button type="button" data-workflow="confirm-new" class="primary">Создать пустую комнату</button></div></form>`;document.body.append(dialog);

function constructionSummary(){const base=model.modules.find(m=>m.type==='base'&&m.front==='single'),b=base?base.h-base.leg:770;return `<div class="surface construction-summary"><div class="section-label">ПЕРВЫЙ ШАБЛОН · BETWEEN-SIDES / 1</div><h3>Базовый шкаф: дно между стойками</h3><p>Две полноразмерные стойки. Дно и две верхние стяжки находятся между ними. Задник ХДФ 3 мм накладной. Съёмная полка короче проёма на 2 мм; глубина меньше корпуса на 20 мм. Накладной фасад, равные зазоры.</p><details><summary>Расчёт ${base?base.id:'примера 600 × 870 × 560'} и что ещё согласовать</summary><p>Корпус без опор: ${fmt(b)} мм. Проём: ширина минус две толщины стойки. Для примера 600 × 870 × 560 мм, опор 100 мм и плиты 18 мм: стойки 560 × 770; дно 564 × 560; стяжки 564 × 100; полка 562 × 540; фасад при зазоре 2 мм — 596 × 766. Размеры чистовые, кромка вычитается из заготовки отдельно.</p><p>Размеры сверены независимым ручным расчётом. Точки конфирматов остаются проектными; сверло, глубины, петли, опоры, крепёж задника и межсекционные стяжки требуют конкретного комплекта и согласования с цехом. Геометрия базового примера проверена, выпуск производственной присадки не подтверждён.</p></details><div class="actions"><button data-view="parts">Ведомость деталей</button><button data-action="cut-csv" class="primary">Экспорт CSV · черновик</button></div><p class="hint">В экспорт попадут чистовые размеры и заготовки, кромки, цвет / декор, ID, шаблон, дата и ревизия ${config.revision}. Соглашение: миллиметры, базирование от готовой кромлёной детали. Уточнить возможности цеха.</p></div>`;}
</script><script>'use strict';
let stage='room',catalogCategory='base',catalogSearch='',showDimensions=false,seeThrough=false,showHardware=false,planCamera=false,planLayer='base',inspection=null,sceneGestures=null,snapGuides=[],roomGroup,moduleGroups=new Map(),accessories=[],frontPose=new Map(),frontTarget=new Map(),motionFrame=0,undoStack=[],selectedModule=false,dragState=null,roomLights=[],ceilingLight;

function renderCatalog(){const cats=[['base','Нижние'],['wall','Верхние'],['corner','Угловые'],['tall','Пеналы'],['appliances','Техника'],['dining','Столы и стулья']];return `<p class="rail-description">Добавь модуль из каталога. Перетаскивай его в режиме «Расставлять».</p><div class="catalog-filter">${cats.map(([id,label])=>`<button data-category="${id}" aria-pressed="${catalogCategory===id}">${label}</button>`).join('')}</div><input id="catalog-search" class="catalog-search" placeholder="Найти модуль" aria-label="Найти модуль" value="${esc(catalogSearch)}"><div class="catalog-grid">${Planner.catalog.filter(c=>(catalogSearch?c.name.toLowerCase().includes(catalogSearch.toLowerCase()):c.category===catalogCategory)).map(c=>`<button class="catalog-card" data-catalog="${c.id}">${moduleThumb(c)}<div><b>${c.name}</b><span>${c.note}</span><em>${c.w} мм · изменить после добавления<br>Для планировки</em></div></button>`).join('')||'<p class="hint">Модуль не найден</p>'}</div><div class="rail-divider"></div><div class="section-label">В комнате</div><div class="placed-list">${config.modules.map(m=>`<button class="placed-item" data-module="${m.id}" aria-pressed="${selectedModule&&active===m.id}">${esc(m.name)}<span>${m.id}</span></button>`).join('')}</div>`;}
function renderSettings(){if(stage==='production'){renderTechnicalSettings();$('#settings').innerHTML='<details class="workflow-fold"><summary>Параметры конструкции '+active+'</summary>'+$('#settings').innerHTML+'</details>';enhanceSettings();return;}$('#rail-heading').textContent={room:'Твоя комната',modules:'Каталог модулей',design:'Отделка и наполнение'}[stage];$('#add').hidden=stage==='room'||stage==='design';if(stage==='room'){$('#settings').innerHTML=`<p class="rail-description">Сначала задай помещение и проёмы. ${config.room.isExample!==false?'Сейчас показан пример комнаты.':'Размеры твоего помещения сохранены.'}</p><div class="room-grid"><fieldset><legend>Размер комнаты</legend><div class="two">${roomInput('w','Ширина',1800,12000)}${roomInput('d','Глубина',1800,12000)}</div>${roomInput('h','Потолок',2000,4000)}<button data-planner="apply-room" class="primary">Применить размеры</button></fieldset><fieldset><legend>Окна и двери</legend><div class="room-actions"><button data-planner="add-window">＋ Окно</button><button data-planner="add-door">＋ Дверь</button></div><div class="opening-list">${config.room.openings.map(o=>openingForm(o)).join('')}</div></fieldset></div><div class="step-note">Мебель не займёт проём двери или окна. Точные подводы и размеры техники добавим по паспортам выбранных приборов.</div><button data-planner="clear-layout" class="remove">Очистить расстановку</button>`;enhanceSettings();return;}if(stage==='modules'){$('#settings').innerHTML=renderCatalog();enhanceSettings();return;}const f=config.finish,m=getModule(),pal=['#e3ded2','#9eac93','#d4b79f','#b3b7b8','#64786c','#42494a'];$('#settings').innerHTML=`<p class="rail-description">Начни с общей палитры. Отдельный модуль можно выбрать в комнате.</p><div class="design-content"><fieldset><legend>Фасады ${selectedModule?'· '+active:'· вся кухня'}</legend><div class="palette">${pal.map(c=>`<button class="color-chip" data-paint="${c}" style="background:${c}" aria-label="Цвет ${c}" aria-pressed="${m?.frontColor===c}"></button>`).join('')}</div><label>Свой цвет<input id="global-front-color" type="color" value="${m?.frontColor||'#9eac93'}"></label><label>Материал<select id="global-front-decor" class="design-select">${options(decorOptions(),m?.frontDecor||'paint')}</select></label></fieldset><fieldset><legend>Столешница и фартук</legend><label class="switch-row">Столешница<input type="checkbox" data-finish="countertop" ${f.countertop?'checked':''}></label><label>Цвет столешницы<input type="color" data-finish="counterColor" value="${f.counterColor}"></label><label class="switch-row">Фартук<input type="checkbox" data-finish="backsplash" ${f.backsplash?'checked':''}></label><label>Фартук<select data-finish="splashStyle">${options([['tile','Светлая плитка'],['plain','Однотонная панель']],f.splashStyle)}</select></label><label>Цвет фартука<input type="color" data-finish="splashColor" value="${f.splashColor}"></label></fieldset><fieldset><legend>Свет</legend><label class="switch-row">Подсветка под верхними<input type="checkbox" data-finish="underlight" ${f.underlight?'checked':''}></label><label>В комнате<select data-finish="light">${options([['day','Мягкий дневной'],['warm','Тёплый вечерний']],f.light)}</select></label></fieldset><fieldset><legend>Ручки</legend><select id="global-handles">${options([['bar','Прямые ручки'],['knob','Круглые ручки'],['none','Без ручек · систему уточнить']],m?.handles||'bar')}</select><p class="hint">Наполнение ящиков выбирается в карточке модуля.</p></fieldset></div>`;enhanceSettings();}
function openingForm(o){return `<div class="opening-card" data-opening="${o.id}"><div class="opening-head"><span>${o.kind==='window'?'Окно':'Дверь'}</span><button data-delete-opening="${o.id}" aria-label="Убрать проём">×</button></div><label>Стена<select data-opening-field="wall">${options([['back','Задняя'],['left','Слева'],['right','Справа'],['front','Передняя']],o.wall)}</select></label><div class="two">${[['offset','От начала стены'],['width','Ширина'],['height','Высота'],...(o.kind==='window'?[['sill','Подоконник']]:[])].map(([k,l])=>`<label>${l}<input type="number" data-opening-field="${k}" min="0" max="12000" value="${o[k]}"></label>`).join('')}</div><button data-apply-opening="${o.id}" style="width:100%;margin-top:8px;font-size:10px;min-height:26px">Применить</button></div>`;}
function updateCard(){if(inspection){renderInspectionCard();return;}if(stage==='production'){updateTechnicalCard();$('#module-card').hidden=true;return;}$('#part-card').hidden=true;const m=getModule();$('#module-card').hidden=!selectedModule||!m||stage==='room';if(!selectedModule||!m||stage==='room')return;const profile=m.front==='drawers',sceneOnly=['appliance','furniture'].includes(m.type);$('#module-card').innerHTML=`<div class="card-heading"><div><small>${m.id} · ${m.type==='appliance'?'техника':m.type==='furniture'?'обеденная мебель':m.type==='wall'?'верхний':m.type==='tall'?'пенал':'нижний'} модуль</small><h3>${esc(m.name)}</h3></div><button data-planner="close-card" aria-label="Закрыть карточку">×</button></div><div class="size-chips"><span><b>${fmt(m.w)}</b>ширина</span><span><b>${fmt(m.h)}</b>высота</span><span><b>${fmt(m.d)}</b>глубина · мм</span></div>${rowCard(m)}<p class="card-note">${['appliance','furniture'].includes(m.type)?'Планировочный объект. Размеры уточняются по выбранной модели.':'Размеры корпуса с опорами. Столешница и ручки добавляются к габаритам.'}</p><div class="actions"><button data-planner="toggle-module-front" ${!meshes.some(x=>x.userData.module===m.id&&x.userData.p.kind==='front')?'disabled':''}>${moduleIsOpen(m.id)?'Закрыть':'Открыть'}</button><button data-planner="inspect-module">Осмотреть</button></div><details><summary>Размеры и исполнение</summary><div><div class="two">${['w','h','d'].map((k,i)=>`<label>${['Ширина','Высота','Глубина'][i]}<input data-card-field="${k}" type="number" value="${m[k]}" min="${m.type==='furniture'?(k==='h'?450:200):m.type==='appliance'?(k==='h'?(m.appliance==='hob'?20:['hood','microwave'].includes(m.appliance)?100:400):180):k==='d'?180:250}" max="${['appliance','furniture'].includes(m.type)?3000:k==='h'?2500:k==='d'?800:1200}"></label>`).join('')}</div>${!['appliance','furniture'].includes(m.type)?`<label>Фасады<select data-card-field="front">${options([['single','Одна дверь'],['double','Две двери'],['drawers','Ящики'],['none','Без фасада']],m.front)}</select></label>`:''}${sceneOnly?'':profile?`<div class="two"><label>Количество<select data-card-field="drawerCount">${options([['2','Два'],['3','Три'],['4','Четыре']],String(m.drawerCount))}</select></label><label>Высоты<select data-card-field="drawerPattern">${options([['cutlery','Приборы сверху'],['equal','Одинаковые']],m.drawerPattern)}</select></label></div>`:`<div class="two"><label>Полки<input data-card-field="shelves" type="number" min="0" max="12" value="${m.shelves}"></label><label>Навеска<select data-card-field="hingeSide">${options([['left','Слева'],['right','Справа']],m.hingeSide)}</select></label></div>`}<button data-planner="apply-module" style="width:100%;margin-top:10px">Применить</button></div></details><details><summary>Расположение</summary><div><label>У стены<select id="module-wall">${options([['back','Задняя'],['left','Левая'],['right','Правая'],['front','Передняя']],'back')}</select></label><button data-planner="place-wall" style="width:100%;margin-top:7px">Поставить к стене</button><div class="two" style="margin-top:10px"><label>X · центр<input data-pose="x" type="number" value="${Math.round(m.placement.x)}"></label><label>Z · центр<input data-pose="z" type="number" value="${Math.round(m.placement.z)}"></label></div>${m.type==='wall'||m.mountY?`<label>Нижняя отметка<input data-card-field="mountY" type="number" min="0" max="${config.room.h-m.h}" value="${m.mountY}"></label>`:''}<div class="actions"><button data-planner="apply-pose">Применить</button><button data-planner="turn-module">↻ 90°</button></div></div></details>${!sceneOnly?`<details><summary>Фурнитура и наполнение</summary><div><label>Производитель<select data-card-field="brand">${options([['hettich','Hettich'],['blum','Blum']],m.brand)}</select></label>${profile?`<label>Наполнение<select data-card-field="filling">${options([['empty','Пустой ящик'],['cutlery','Разделители для приборов'],['pots','Кастрюли и посуда']],m.filling)}</select></label>`:''}<p class="card-note">Направляющие и петли для производства назначаются по точному артикулу. Наполнение пока визуальное.</p><button data-planner="apply-module" style="width:100%;margin-top:7px">Применить</button></div></details>`:''}<div class="actions"><button data-planner="duplicate-module">Дублировать</button>${!sceneOnly?'<button data-planner="module-parts">Детали →</button>':''}</div><button data-planner="remove-module" class="remove danger">Убрать из комнаты</button>`;$('#module-card').scrollTop=0;}
function selectModule(id){sceneGestures?.cancelPendingClick();if(inspection&&id!==inspection.id){openInspection(id);return;}if(!config.modules.some(m=>m.id===id))return;active=id;selectedModule=true;insideModule=false;if(planCamera){if(planLayer!=='all')planLayer=getModule().type==='wall'||getModule().mountY>=1000?'wall':'base';updateCameraButtons();}selected=model.parts.find(p=>p.module===id)?.id||null;selectedHole=getPart()?.holes[0]?.id||null;isolated=false;renderModules();if(stage==='production'||stage==='design')renderSettings();syncSelectionButtons();renderCurrent();update3d();}
function placementMessage(text){$('#placement-message').textContent=text||'';$('#placement-message').classList.toggle('visible',!!text);}
function tryPose(m,pose){if(m.locked||KitchenRows.rowFor(config,m.id)){toast(m.locked?'Шкаф зафиксирован':'Шкаф связан с рядом. Сначала выбери «Разместить свободно».');return false;}const adjusted=Planner.clampPose(m,pose,config.room),problem=Planner.placementProblem(m,adjusted,config);if(problem){placementMessage(problem);return false;}m.placement=adjusted;placementMessage(null);frontPose.clear();frontTarget.clear();persist();update3d();updateCard();updateStats();return true;}
function applyCard(){const m=getModule();if(!m)return;const patch={};for(const el of $('#module-card').querySelectorAll('[data-card-field]')){const k=el.dataset.cardField;if(el.type==='number'&&!el.checkValidity()){toast('Проверь допустимые размеры');return;}patch[k]=el.type==='number'||k==='drawerCount'?Number(el.value):el.value;}if(patch.front==='drawers')patch.shelves=0;const next=occupancy({...m,...patch});commitCommand(KitchenRows.resize(config,m.id,{...patch,footFront:next.footFront,topExtra:next.topExtra}),'Размеры и детали пересчитаны');}

function addCatalog(id){if(inspection)closeInspection();if(config.modules.length>=30){toast('В одном проекте до 30 модулей');return;}const m=occupancy(Planner.newModule(nextID(),id));let place=Planner.findSpace(m,config);if(['hob','hood','microwave'].includes(m.appliance)&&getModule()&&!['wall','tall','appliance','furniture'].includes(getModule().type)){const base=getModule();if(m.appliance!=='hood')m.mountY=base.h+(config.finish.countertop?38:0);const on={...base.placement};if(!Planner.placementProblem(m,on,config))place=on;}if(place)place=Planner.snapPose(m,place,config).pose;if(!place){toast('Нет свободного места. Освободи место или измени комнату.');return;}remember();m.placement=place;config.modules.push(m);active=m.id;selectedModule=true;rebuild();mode='move';updateMode();toast('Модуль добавлен. Перетащи его в нужное место.');}
function paletteApply(color){remember();const targets=selectedModule?[getModule()]:config.modules;for(const m of targets){m.frontColor=color;m.frontDecor='paint';}rebuild();}
$('#flow').addEventListener('click',e=>{const b=e.target.closest('[data-stage]');if(b){setStage(b.dataset.stage);if(b.dataset.stage==='production')setView('order');}});$('#next-stage').onclick=()=>{if(stage==='production')setView('parts');else if(stage==='room')setStage('modules');else {setStage('production');setView('order');}};$('#undo').onclick=()=>restoreHistory(undoStack,redoStack,'Изменение отменено');$('#add').onclick=()=>setStage('modules');

text-anchor="middle">${key} ${fmt(value)}</text></g>`;}overlay.innerHTML=svg;}
$('#rotate').onclick=()=>{mode='rotate';updateMode();};$('#pan').onclick=()=>{mode='pan';updateMode();};$('#move-module').onclick=()=>{mode='move';updateMode();};$('#camera-plan').onclick=()=>{if(inspection)closeInspection(false);planCamera=true;planLayer=selectedModule&&(getModule()?.type==='wall'||getModule()?.mountY>=1000)?'wall':'base';updateCameraButtons();update3d();fitRoom();};$('#camera-3d').onclick=()=>{if(inspection)closeInspection(false);planCamera=false;updateCameraButtons();update3d();fitRoom();};$('#fit').onclick=()=>{if(inspection){closeInspection();return;}isolated=false;scoped=false;update3d();fitRoom();};$('#zoom-in').onclick=()=>zoom3d(.8);$('#zoom-out').onclick=()=>zoom3d(1.25);$('#scope').onclick=()=>inspection?closeInspection():openInspection(active);$('#transparent').onclick=()=>{seeThrough=!seeThrough;update3d();};$('#hardware').onclick=()=>{showHardware=!showHardware;update3d();};$('#dimensions').onclick=()=>{showDimensions=!showDimensions;update3d();};$('#open-fronts').onclick=()=>toggleModule(active);$('#explode').onclick=()=>{if(stage!=='production'&&!inspection)return;exploded=!exploded;if(exploded){scoped=true;isolated=false;update3d();focusModule(active);camera.position.sub(aim).multiplyScalar(1.25).add(aim);camera.lookAt(aim);}frontPose.clear();frontTarget.clear();cancelAnimationFrame(animation);explosionFrom=explosionAmount;explosionTo=exploded?1:0;animationStart=performance.now();function tick(now){const t=Math.min(1,(now-animationStart)/650);explosionAmount=explosionFrom+(explosionTo-explosionFrom)*t*t*(3-2*t);update3d();if(t<1)animation=requestAnimationFrame(tick);}animation=requestAnimationFrame(tick);};
document.addEventListener('click',e=>{const b=e.target.closest('[data-plan-layer]');if(b){planLayer=b.dataset.planLayer;updateCameraButtons();update3d();}});
installWorkflow();normalizeProject();init3d();rebuild();const hash=new URLSearchParams(location.hash.substring(1));if(config.modules.some(m=>m.id===hash.get('module')))active=hash.get('module');if(model.parts.some(p=>p.id===hash.get('part')))selected=hash.get('part');setStage([...stages,'design'].includes(hash.get('stage'))?hash.get('stage'):'room');if(['parts','drilling','assembly','cutting','order'].includes(hash.get('view')))setView(hash.get('view'));fitRoom();
